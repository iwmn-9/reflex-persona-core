name: Continuing owner horizon comparison
run-name: Horizon comparison ${{ inputs.label || 'development-43' }}
on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        required: true
      jobs:
        description: Explicit registered matrix include array; empty uses the committed development plan
        type: string
        required: false
      stage:
        type: choice
        options: [development, confirmation, stress, diagnostic]
        default: development
permissions:
  contents: read
  actions: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: plan
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          jobs=json.loads(os.environ['JOBS']) if os.environ['JOBS'] else json.loads(Path('evidence/long_horizon/development_plan.json').read_text())['new_jobs']
          assert isinstance(jobs,list) and 1<=len(jobs)<=256
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('include='+json.dumps(jobs,separators=(',',':'))+'\n')
          PY
  study:
    needs: matrix
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13.16'
      - run: python -m pip install -e . numpy==2.5.4
      - name: Restore the registered frozen execution when requested
        if: ${{ matrix.resume_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ matrix.resume_run }}
          ARTIFACT: ${{ matrix.resume_artifact }}
        run: |
          python - <<'PY'
          import os,re,subprocess
          previous=os.environ['PREVIOUS_RUN'];artifact=os.environ['ARTIFACT']
          assert re.fullmatch(r'[0-9]+',previous) and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]+',artifact)
          subprocess.run(['gh','run','download',previous,'--name',artifact,'--dir','results/horizon'],check=True)
          PY
      - name: Run registered persistent world
        timeout-minutes: 345
        env:
          JOB: ${{ toJSON(matrix.job) }}
          STAGE: ${{ inputs.stage || 'development' }}
          RECOVERY_LIMIT: ${{ matrix.recovery_limit || 16 }}
          RESUME_MANIFEST: ${{ matrix.resume_manifest }}
          RESUME_RUN: ${{ matrix.resume_run }}
        run: |
          if [ -n "$RESUME_RUN" ]; then
            python tools/resume_horizon_study.py --root results/horizon --job "$JOB" --manifest "$RESUME_MANIFEST"
          else
            python tools/run_horizon_study.py --root results/horizon --job "$JOB" --stage "$STAGE" --recovery-limit "$RECOVERY_LIMIT"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: horizon-${{ matrix.key }}
          path: results/horizon
          retention-days: 14
