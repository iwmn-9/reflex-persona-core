name: Auction recovery independent replication
on:
  push:
    branches: ['research/auction-replication']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replication:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [21001, 21002, 21003, 21004, 21005, 21006, 21007, 21008,
               21009, 21010, 21011, 21012, 21013, 21014, 21015, 21016]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: >-
          python tools/run_owned_value.py --root results/replication
          --games auction --seeds ${{ matrix.seed }} --profiles 0 1 2 3
          --regimes outside shift-return --arms endpoint endpoint_posterior
          --turns 128 --interval 7 --tail-steps 15 --workers 2 --stage confirmation
      - run: python tools/audit_auction_recovery.py results/replication
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: auction-replication-${{ matrix.seed }}
          path: results/replication
          retention-days: 7
