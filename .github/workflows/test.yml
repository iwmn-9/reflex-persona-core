name: Numeric core tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Build and install an isolated wheel
        run: |
          python -m pip wheel --no-deps . -w dist
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--target', 'isolated-wheel', glob.glob('dist/*.whl')[0]])"
      - name: Verify installed lifecycle without research imports
        run: |
          python -I tools/verify_receding_package.py isolated-wheel
          python -I tools/verify_receding_package.py isolated-wheel --controller fixed
