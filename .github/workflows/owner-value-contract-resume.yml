name: Continue interrupted cumulative value pairs
run-name: Value contract continuation ${{ inputs.label }}
on:
  push:
    branches: [research/long-horizon]
    paths: [.github/workflows/owner-value-contract-resume.yml]
  workflow_dispatch:
    inputs:
      label:
        type: string
        required: true
      batches:
        type: string
        required: true
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  observer-smoke:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13.16'
      - name: Verify progress can be read before the computation step ends
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import time
          from tools.observe_horizon_pairs import CheckPublisher,utc
          publisher=CheckPublisher('transport-probe-not-an-experiment')
          value=dict(version='horizon-progress-v1',run=publisher.run,attempt=publisher.attempt,
            head_sha=publisher.head,external_id=publisher.external,observed_at=utc(),arms=[],
            transport_probe=True,sequence=0)
          publisher.publish(value)
          time.sleep(90)
          value.update(observed_at=utc(),sequence=1)
          publisher.publish(value,finished=True)
          PY
  matrix:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          BATCHES: ${{ inputs.batches }}
        run: |
          python - <<'PY'
          import json,os,re
          batches=json.loads(os.environ['BATCHES']);seen=set()
          assert isinstance(batches,list) and 1<=len(batches)<=64
          for batch in batches:
              assert 1<=len(batch['pairs'])<=2
              for pair in batch['pairs']:
                  assert len(pair['jobs'])==len(pair['inputs'])==len(pair['keys'])==2
                  assert pair['jobs'][0][:6]==pair['jobs'][1][:6] and pair['jobs'][0][7:]==pair['jobs'][1][7:]
                  assert type(pair.get('recorded_predictions',False)) is bool
                  assert type(pair.get('guard_history',False)) is bool
                  for key,item in zip(pair['keys'],pair['inputs']):
                      assert key not in seen and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]+',key)
                      seen.add(key)
                      assert re.fullmatch(r'[0-9]+',str(item['run']))
                      assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]+',item['artifact'])
                      assert all(re.fullmatch(r'[a-f0-9]{64}',item[k]) for k in ('manifest','checkpoint'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('include='+json.dumps(batches,separators=(',',':'))+'\n')
          PY
  study:
    needs: matrix
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13.16'
      - run: python -m pip install -e . numpy==2.5.4
      - name: Restore both original immutable executions
        env:
          GH_TOKEN: ${{ github.token }}
          PAIRS: ${{ toJSON(matrix.pairs) }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          for index,pair in enumerate(json.loads(os.environ['PAIRS'])):
              for side,item in enumerate(pair['inputs']):
                  subprocess.run(['gh','run','download',str(item['run']),'--name',item['artifact'],
                      '--dir',f'results/input/p{index}/a{side}'],check=True)
          PY
      - name: Resume at each pair's common experience boundary
        timeout-minutes: 345
        env:
          PAIRS: ${{ toJSON(matrix.pairs) }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/observe_horizon_pairs.py
      - name: Finalize progress check without declaring experiment completion
        if: ${{ always() }}
        env:
          PAIRS: ${{ toJSON(matrix.pairs) }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/observe_horizon_pairs.py --finalize
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && matrix.pairs[0] }}
        with:
          name: value-contract-${{ matrix.pairs[0].keys[0] }}
          path: results/value-contract/pair0/baseline
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && matrix.pairs[0] }}
        with:
          name: value-contract-${{ matrix.pairs[0].keys[1] }}
          path: results/value-contract/pair0/candidate
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && matrix.pairs[1] }}
        with:
          name: value-contract-${{ matrix.pairs[1].keys[0] }}
          path: results/value-contract/pair1/baseline
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && matrix.pairs[1] }}
        with:
          name: value-contract-${{ matrix.pairs[1].keys[1] }}
          path: results/value-contract/pair1/candidate
          retention-days: 14
