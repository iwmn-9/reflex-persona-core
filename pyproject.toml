[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-persona-core"
version = "0.1.0a1"
description = "Experimental batched personality-conditioned NPC decisions with bounded observed experience"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.urls]
Repository = "https://github.com/iwmn-9/reflex-persona-core"

[project.optional-dependencies]
mahjong = ["riichienv==0.4.10"]

[project.scripts]
reflex-persona = "reflex.cli:main"

[tool.setuptools.packages.find]
include = ["reflex"]

[tool.setuptools.package-data]
reflex = ["lab_viewer.html"]
