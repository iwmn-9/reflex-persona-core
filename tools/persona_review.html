<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>人格判断の確認版</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--panel:#fff;--fg:#202630;--muted:#4e5c6c;--line:#ccd4dc;--active:#176454;--soft:#e5f4ee;--warn:#8e421a}
@media(prefers-color-scheme:dark){:root{--bg:#151b22;--panel:#202832;--fg:#edf2f7;--muted:#bdc9d6;--line:#485767;--active:#8ae1c2;--soft:#203b36;--warn:#ffbe8d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,"Meiryo",sans-serif}main{max-width:1120px;margin:auto;padding:28px 22px 50px}h1{font-size:28px;margin:0 0 7px}h2{font-size:20px;margin:0}h3{font-size:16px;margin:14px 0 4px}p{margin:6px 0}small,.muted{color:var(--muted);font-size:13px}button,select,textarea,input{font:inherit}button,select,textarea{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px}button{padding:7px 12px;cursor:pointer;min-height:42px}select{padding:8px;max-width:100%;width:100%;min-width:0}textarea{display:block;width:100%;padding:8px;resize:vertical;min-height:65px}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--active);outline-offset:2px}button[aria-pressed=true]{background:var(--soft);border-color:var(--active)}button:disabled{opacity:.5;cursor:default}.controls{margin-top:22px;padding:17px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.fields{display:grid;grid-template-columns:2fr 1fr;gap:16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:15px}.toolbar strong{margin-right:auto}input[type=range]{width:100%;accent-color:var(--active)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px;min-width:0;overflow-wrap:anywhere}.choice{font-size:24px;font-weight:650;color:var(--active);margin:10px 0}.variant{font-size:13px;color:var(--muted)}.numbers{display:flex;gap:10px 20px;flex-wrap:wrap;margin:12px 0}.number{min-width:85px}.number strong{display:block;font-size:18px}.number span{color:var(--muted);font-size:13px}details{border-top:1px solid var(--line);padding-top:10px;margin-top:14px}summary{cursor:pointer;min-height:35px}.options{padding-left:20px}.options li{margin:10px 0}.line{margin:8px 0;font-size:14px}.flag{color:var(--warn)}.votes{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.votes button{font-size:14px}.reviewer{margin-top:15px;border-top:1px solid var(--line);padding-top:10px}.footer{margin-top:28px;padding-top:15px;border-top:1px solid var(--line)}.sequence{padding-left:23px;font-size:14px}.sequence li{padding:3px 0}.sequence .selected{font-weight:650;color:var(--active)}.notice{padding:10px 0;color:var(--muted);font-size:14px}.done{color:var(--muted)}.proof{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
@media(max-width:700px){main{padding:19px 12px 36px}.fields,.grid{grid-template-columns:1fr}.card{padding:14px}h1{font-size:24px}.toolbar{gap:7px}.toolbar strong{flex-basis:100%}}
</style>
</head>
<body><main>
<h1>人格判断の確認版</h1>
<p>同じ状況で何を選ぶか。何を手放し、次の手で何が起きるか。</p>
<p class="muted">通常の数値判断の実演と、先読みの改善・失敗記録。展示の選択は教師正解ではない。</p>
<section class="controls" aria-label="場面と表示する手">
<div class="fields"><label for="case">場面<select id="case"></select></label><label for="profile">人物<select id="profile"><option value="all">四人格を並べる</option></select></label></div>
<p id="description" class="notice"></p><p id="fact"></p>
<div class="toolbar"><strong id="turn" aria-live="polite"></strong><button id="previous" type="button">前の手</button><button id="next" type="button">次の手</button><button id="last" type="button">終わりを見る</button></div>
<label class="muted" for="scrub">表示する時点</label><input id="scrub" type="range" min="0" value="0">
<p id="comparison-note" class="muted"></p>
</section>
<div id="actors" class="grid" aria-label="各人物の判断"></div>
<section class="footer"><h2>感触を残す</h2><p>「その人物らしい損」か「判断が悪い」のか。各手の評価とメモを保存できる。</p>
<p class="muted">このブラウザ内だけに保存。外部送信や自動学習はしない。移動する際は評価を書き出して残す。</p>
<div class="toolbar"><button id="export" type="button">評価を書き出す</button><span id="saved" role="status"></span></div>
<details><summary>記録の出所と確認範囲</summary><p id="proof" class="proof"></p><p class="muted">性格値の保存・実行の再生は確認した。人間らしさ、最適な選択、未知のゲームへの汎化は未確認。モデル分岐の割合は実世界の勝率ではない。動作中のLLMとColabは使っていない。</p></details>
</section>
</main>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('review-data').textContent);
const $=id=>document.getElementById(id);
const traits={openness:'開放性',conscientiousness:'誠実性',extraversion:'外向性',agreeableness:'協調性',neuroticism:'神経症傾向'};
const values={self_direction:'自律',stimulation:'刺激',hedonism:'快楽',achievement:'達成',power:'権力',security:'安全',conformity:'同調',tradition:'伝統',benevolence:'慈善',universalism:'普遍性'};
const needs={physiology:'活動・回復',safety:'安全・備え',belonging:'所属',esteem:'承認',growth:'成長'};
const names={take:'自分の取り分を確保',share:'分け合う',recover:'活動余力を回復',CLAIM:'取り分を主張',HELP:'協力する',RECOVER:'応急回復',REST:'休息',SECURE:'確実な取り分',TRAIN_RISK:'高リスクの成長',TRAIN_SAFE:'堅実な成長',WORK_RISK:'高収益の作業',WORK_SAFE:'堅実な作業',rest:'休息',collect:'物資を調達',load:'積載',aid:'他者へ援助',fulfil:'自分の納品',research:'研究',settle:'領土を広げる',reload:'弾を装填',guard:'防御する'};
const buildings={farm:'農場',forest:'森林',mine:'鉱山',market:'市場',lab:'研究施設',monument:'記念施設'};
const variants={finite:'有限の主義優先・数値反射',discounted:'基準：終局に時間割引',absolute:'比較案：終局割引なし（一律不採用）',hybrid:'基準：目的の全結果を比較',guarded:'目的水準を守る設定（大きな犠牲を制約）'};
const statuses={success:'目標達成',failure:'目標未達・敗北',draw:'引き分け・期限未達',scored:'目的点で終了',running:'進行中'};
const cn={continuation_changed:'その後の再判断で行動列が変わった',censored:'実記録がモデルの時点まで届いていない',actions_matched_states_unchecked:'行動列は同じ（モデル内状態の一致は未確認）'};
const fmt=x=>typeof x==='number'?Number(x.toFixed(3)).toString():String(x);
function action(k){if(names[k])return names[k];if(k.startsWith('build:'))return (buildings[k.slice(6)]||k.slice(6))+'を整備';if(k.startsWith('gather:'))return (k.slice(7)==='food'?'食料':k.slice(7))+'を確保';if(k.startsWith('shoot:'))return '相手を射撃';if(k.startsWith('heal:'))return '自分を治療';if(k.startsWith('move:'))return '位置を変える（'+k.slice(5).replace(':',',')+'）';return k}
function text(parent,tag,value,cl){const el=document.createElement(tag);el.textContent=value;if(cl)el.className=cl;parent.append(el);return el}
function detail(parent,title){const el=document.createElement('details');parent.append(el);text(el,'summary',title);return el}
function listEffects(o,dict){return Object.entries(o||{}).filter(([,v])=>Math.abs(v)>1e-9).map(([k,v])=>(dict[k]||k)+' '+(v>0?'+':'')+fmt(v)).join(' / ')||'変化なし'}
function numbers(parent,items){const box=document.createElement('div');box.className='numbers';parent.append(box);for(const [label,before,after] of items){const el=document.createElement('div');el.className='number';box.append(el);text(el,'span',label);text(el,'strong',before==null?fmt(after):fmt(before)+' → '+fmt(after))}}
function measures(parent,b,a){if(a.empires){const x=b.empires[0],y=a.empires[0];numbers(parent,[['食料',x.stock[0],y.stock[0]],['木材',x.stock[1],y.stock[1]],['鉱石',x.stock[2],y.stock[2]],['資金',x.stock[3],y.stock[3]],['研究蓄積',x.science,y.science],['技術段階',x.tech,y.tech],['領土',x.land,y.land]])}else if(a.units){const x=b.units[0],y=a.units[0],u=a.units[3];numbers(parent,[['自分のHP',x.hp,y.hp],['残弾',x.ammo,y.ammo],['治療具',x.kit,y.kit],['相手HP',b.units[3].hp,u.hp]])}else if('cargo' in a){numbers(parent,[['活動余力',b.energy,a.energy],['調達済み',b.stock,a.stock],['積載',b.cargo,a.cargo],['自分の納品',b.delivered,a.delivered],['援助',b.community,a.community]])}else{numbers(parent,[['活動余力',b.energy,a.energy],['供給',b.stock,a.stock],['技能',b.skill,a.skill]])}}
let reviews={};let storageAvailable=true;const storageKey='persona-review:'+data.digest;
try{reviews=JSON.parse(localStorage.getItem(storageKey)||'{}');if(!reviews||Array.isArray(reviews)||typeof reviews!=='object')reviews={}}catch(e){storageAvailable=false;reviews={}}
function saved(){ $('saved').textContent=Object.keys(reviews).length+'件の判断に記録'+(storageAvailable?'':'（保存領域が使えないため、書き出して保持）') }
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(reviews))}catch(e){storageAvailable=false}saved()}
function reviewKey(c,t,f){return c.id+'/'+t.id+'/'+f.turn}
function voting(parent,c,t,f){const key=reviewKey(c,t,f),el=document.createElement('div');el.className='reviewer';parent.append(el);text(el,'div','この判断の感触','muted');const group=document.createElement('div');group.className='votes';el.append(group);for(const [label,val] of [['人物らしく納得','plausible'],['判断が悪い','unwise'],['まだ判断できない','unclear']]){const btn=text(group,'button',label);btn.type='button';btn.setAttribute('aria-pressed',String(reviews[key]?.verdict===val));btn.addEventListener('click',()=>{reviews[key]={case_id:c.id,track_id:t.id,profile:t.profile,variant:t.variant,turn:f.turn,action:f.action,verdict:val,note:reviews[key]?.note||''};persist();for(const child of group.children)child.setAttribute('aria-pressed',String(child===btn))})}const note=document.createElement('textarea');note.id='note-'+c.id+'-'+t.id+'-'+f.turn;note.maxLength=600;note.value=reviews[key]?.note||'';const label=text(el,'label','理由・気になる点（任意）','muted');label.htmlFor=note.id;el.append(note);note.addEventListener('input',()=>{const current=reviews[key]||{case_id:c.id,track_id:t.id,profile:t.profile,variant:t.variant,turn:f.turn,action:f.action,verdict:'pending'};reviews[key]={...current,note:note.value};persist()})}
function scoreOptions(parent,f){if(!f.immediate)return;const r=f.immediate;const e=detail(parent,'その時の選択肢と採点');text(e,'p','判断前の不足：'+Object.entries(r.needs).map(([k,v])=>needs[k]+' '+fmt(v.deficit)).join(' / '),'line');text(e,'p','採点は本人の主観。個人的利得・欲求・主義・リスクをまとめた数値で、賢さの正解スコアではない。','muted');const ul=document.createElement('ul');ul.className='options';e.append(ul);for(const c of r.choices){const li=document.createElement('li');ul.append(li);text(li,'strong',action(c.action)+(c.action===f.action?' ← 選択':''));text(li,'div','主観採点 '+fmt(c.score)+' / '+(c.eligible?'選択可能':'候補から除外'),'line');for(const o of c.outcomes){text(li,'div','ルール上の分岐 '+fmt(o.p*100)+'% / 自己利得 '+fmt(o.objective),'line');if(Object.keys(o.needs).length)text(li,'div','欲求への効果：'+listEffects(o.needs,needs),'muted');if(Object.keys(o.values).length)text(li,'div','主義への効果：'+listEffects(o.values,values),'muted')}}}
function predictions(parent,f){if(!f.branches)return;numbers(parent,[['選んだ案のモデル目的',null,f.selected_model_purpose],['保持候補の最良',null,f.best_model_purpose]]);if(f.model_purpose_gap>1e-8)text(parent,'p','モデル上では目的見込みを '+fmt(f.model_purpose_gap)+' 手放した。納得できる犠牲かは未判定。','flag');const e=detail(parent,'先読みと、その後の実行を分けて見る');text(e,'p','予測値は将来の見込み、下の実行列は事後の記録。再判断で列が変わった後の勝敗を、そのまま元の予測誤りとして学習しない。','muted');for(const [i,b] of f.branches.entries()){text(e,'h3','モデル分岐 '+(i+1)+'：'+statuses[b.modeled_goal.status]+' / 値 '+fmt(b.modeled_goal.value));text(e,'p','予測：'+b.modeled_actions.map(action).join(' → '),'line');text(e,'p','実行：'+b.executed_actions.map(action).join(' → '),'line');text(e,'p',cn[b.status]+(b.first_difference?' / '+b.first_difference+'手目から違う':''),'muted')}}
function fixed(parent,t){const p=data.profiles[t.profile];const e=detail(parent,'固定の性格・主義');text(e,'p',Object.entries(p.personality).map(([k,v])=>traits[k]+' '+fmt(v)).join(' / '),'line');text(e,'p','主義：'+Object.entries(p.values).map(([k,v])=>values[k]+' '+fmt(v)).join(' / '),'line');text(e,'p','これらは工学的な人物設定。心理診断や人間の行動の科学的予測ではない。','muted')}
function final(parent,t){if(!t.final)return;const r=t.final;let s='';if('status' in r)s=statuses[r.status]+' / '+r.steps+'手'+(r.surviving===null?'':r.surviving?' / 生存':' / 死亡')+(r.shortages===null?'':' / 資源不足 '+r.shortages)+(r.solvable_route_lost===null?'':' / 達成可能経路を失った回数 '+r.solvable_route_lost);else s='24手後：供給 '+fmt(r.supply)+' / 技能 '+fmt(r.skill)+' / 協力貢献 '+fmt(r.contribution)+' / 不足 '+r.shortage_turns+'手';text(parent,'p',s,'done')}
function card(c,t,index){const el=document.createElement('article');el.className='card';$('actors').append(el);text(el,'h2',data.profiles[t.profile].name);text(el,'div',variants[t.variant]||t.variant,'variant');const finished=index>=t.frames.length;const f=t.frames[Math.min(index,t.frames.length-1)];if(finished)text(el,'p','この人物の実行は終了している。最後の結果を表示。','done');text(el,'div',action(f.action),'choice');if(finished||index===t.frames.length-1)final(el,t);text(el,'p','主欲求：'+(needs[f.state.primary_need]||'切迫なし')+' / '+(f.state.mode==='principle'?'主義寄りの判断':'欲求寄りの判断'),'muted');if(f.before&&f.after)measures(el,f.before,f.after);else{const choices=f.immediate.choices.filter(x=>x.eligible);const own=x=>x.outcomes.reduce((s,o)=>s+o.p*o.objective,0);const chosen=choices.find(x=>x.action===f.action);numbers(el,[['選んだ自己利得',null,own(chosen)],['最大の自己利得',null,Math.max(...choices.map(own))]]);text(el,'p','これは判断前の効果見込み。実際の結果は生成していない。','muted')}
 if(f.reading){text(el,'p','観測する相手：'+data.profiles[f.reading.partner].name+' / 推定確信度 '+fmt(f.reading.confidence),'muted');} if(f.reading)text(el,'p',f.reading.changed?'観測した相手傾向で変更：'+action(f.reading.reflex_action)+' → '+action(f.action)+'（確信度 '+fmt(f.reading.confidence)+'）':'読みでの手段変更なし。現在の行動を維持。','line');
 if(f.cause==='risk_failed')text(el,'p','今回の確率分岐は失敗。これだけで判断が悪かったとは決めない。','flag');
 if(f.actual_goal)text(el,'p','直後のゲーム評価：'+statuses[f.actual_goal.status]+' / '+fmt(f.actual_goal.value)+(f.actual_goal.status==='running'?'（未完了の代理値）':''),'line');
 if(f.progress){const p=f.progress;text(el,'p','目的進展 '+fmt(p.level_before)+' → '+fmt(p.level_after)+' / 準備 '+fmt(p.readiness_before)+' → '+fmt(p.readiness_after),'line');if(f.unchanged_streak>=3)text(el,'p','目的・準備の指標に変化がない判断が '+f.unchanged_streak+'回続いている。合理的な待機かは別途判断する。','flag')}
 predictions(el,f);scoreOptions(el,f);fixed(el,t);const seq=detail(el,'行動の流れと最後の結果');const list=document.createElement('ol');list.className='sequence';seq.append(list);for(const x of t.frames){const li=text(list,'li',action(x.action));if(x.turn===f.turn)li.className='selected'}final(seq,t);if(!finished)voting(el,c,t,f)}
for(const [i,c] of data.cases.entries()){const o=text($('case'),'option',c.title);o.value=i}for(const p of Object.values(data.profiles)){const o=text($('profile'),'option',p.name);o.value=p.id}
function render(){const c=data.cases[Number($('case').value)],index=Number($('scrub').value);$('scrub').max=c.turns-1;$('scrub').disabled=c.turns===1;$('turn').textContent=(index+1)+' / '+c.turns+' 手';$('description').textContent=c.description;$('fact').textContent=c.fact;$('comparison-note').textContent=c.kind==='recorded'?'同じなのは開始状態。途中では人物・設定ごとに盤面が異なる。将来の実行は事後記録。':c.kind==='snapshot'?'同じ状況を四つの人格で判断する。効果設定は全員共通。':'この場面では四人が同じ世界に参加する。相手の当手は選ぶ前に見せていない。';$('previous').disabled=index===0;$('next').disabled=index>=c.turns-1;$('last').disabled=c.turns===1;$('actors').replaceChildren();for(const t of c.tracks)if($('profile').value==='all'||t.profile===$('profile').value)card(c,t,index);saved()}
$('case').addEventListener('change',()=>{$('scrub').value=0;render()});$('profile').addEventListener('change',render);$('scrub').addEventListener('input',render);$('previous').addEventListener('click',()=>{$('scrub').value=Math.max(0,Number($('scrub').value)-1);render()});$('next').addEventListener('click',()=>{$('scrub').value=Math.min(Number($('scrub').max),Number($('scrub').value)+1);render()});$('last').addEventListener('click',()=>{$('scrub').value=$('scrub').max;render()});
function exportPayload(){return {format:'persona-human-review-v1',artifact_digest:data.digest,source_commit:data.source_commit,training_approved:false,reviews:Object.values(reviews)}}
$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(exportPayload(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='persona-human-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)});
$('proof').textContent='新しい反射実演：四人×24手×3条件＝'+data.proof.laboratory.decisions+'判断。全判断前スナップショットから選択・採点を再生一致。違法手 '+data.proof.laboratory.illegal+'、理解済み失敗の再選択 '+data.proof.laboratory.understood_failure_repeats+'。過去記録の展示 '+data.proof.recorded_episodes+'局・'+data.proof.recorded_frames+'手（比較前後の両設定と四人格を収録）。二巡の元比較全132局は実ルール906遷移を再生確認済み。記録digest '+data.digest+'。';
render();
</script>
</body></html>
